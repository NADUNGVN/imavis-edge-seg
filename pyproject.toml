[project]
name = "imavis-edge-seg"
version = "0.1.0"
description = "PACE-Seg: Platform-Aware Calibrated Elastic Semantic Segmentation for Reliable Edge Vision"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "IMAVIS-EDGE-SEG Research" },
]
keywords = [
    "semantic-segmentation",
    "edge-inference",
    "neural-architecture-search",
    "quantization",
    "calibration",
    "jetson",
    "hailo",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "omegaconf>=2.3",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
    "torchvision>=0.16",
]
deploy = [
    "onnx>=1.15",
    "onnxruntime>=1.16",
]
dev = [
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "types-PyYAML>=6.0",
]
full = [
    "imavis-edge-seg[torch,deploy,dev]",
]

[project.scripts]
imavis-edge-seg = "imavis_edge_seg.cli:app"

[project.urls]
Homepage = "https://github.com/NADUNGVN/imavis-edge-seg"
Documentation = "https://github.com/NADUNGVN/imavis-edge-seg/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imavis_edge_seg"]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# E501: line length handled by formatter. B008: typer.Option(...) as a default is the
# documented typer pattern, not a real mutable-default bug. N812: `torch.nn.functional
# as F` is the universal PyTorch convention.
ignore = ["E501", "B008", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["imavis_edge_seg"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
# 3.12 here matches the numpy/torch stubs actually installed (they use 3.12-only typing
# syntax); requires-python above stays >=3.11 for runtime compatibility.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
packages = ["imavis_edge_seg"]

[[tool.mypy.overrides]]
# torchvision ships no py.typed marker for torchvision.models.segmentation (unlike
# torch itself, which does) -- this is an upstream packaging gap, not our code.
module = "torchvision.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scripts/measure_router_overhead.py runs on a real edge device (Jetson/Hailo), not
# in this dev environment -- pycuda/tensorrt are never installed here, only there.
module = ["pycuda.*", "tensorrt"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow",
    "requires_hardware: marks tests that need real Jetson/Hailo devices (never run in CI)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["imavis_edge_seg"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
