experiment_id: pace_seg_dev_smoke
seed: 0

supernet:
  levels: [tiny, small, medium, large]
  num_classes: 19
  compiler_safe_ops_only: true

search:
  # latency-only: no external power meter yet (deferred 2026-09-11, see
  # RESEARCH_PLAN.md §14) -- switch to measured_latency_energy once one is acquired.
  objective: measured_latency
  # xavier_dla intentionally not a default target: demoted to secondary/encoder-only
  # ablation per RESEARCH_PLAN.md §11's contingency -- see config.py's
  # _default_target_backends() for the full rationale.
  target_backends: [tensorrt_gpu, hailo_hef]

router:
  enabled: true
  strategy: calibrated_risk
  window_frames: 16
  risk_target: 0.05

quantization:
  precision: int8_qat
  calibration_conditions: [clean, night, rain, fog, snow]

datasets:
  - name: cityscapes
    root: /home/ubuntu/Dung_TDTU/datasets/imavis-edge-seg/cityscapes
    split: train
  - name: acdc
    root: /home/ubuntu/Dung_TDTU/datasets/imavis-edge-seg/acdc
    split: train

deployment_targets:
  - device_id: E1
    backend: hailo_hef
  - device_id: E2
    backend: tensorrt_gpu
  - device_id: E3
    backend: tensorrt_gpu

output_root: /home/ubuntu/Dung_TDTU/imavis-edge-seg/outputs
